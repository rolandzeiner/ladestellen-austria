# Config home for ruff, mypy, and coverage. Pytest config stays in pytest.ini.
# Pre-commit and CI may still pass equivalent CLI flags — they are now
# redundant with this file but harmless. Trim them as confidence grows.

[tool.ruff]
# Aligned with the CI Python pin (.github/workflows/validate.yml). HA
# core 2026.5+ supports 3.14 across its transitive deps (pyo3 0.24
# blocker resolved 2026-05-07). Keep this in lockstep with the workflow
# `python-version` so ruff's lint set matches the interpreter CI runs on.
target-version = "py314"
line-length = 88

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["custom_components/ladestellen_austria"]

[tool.coverage.run]
source = ["custom_components/ladestellen_austria"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true
skip_empty = true
